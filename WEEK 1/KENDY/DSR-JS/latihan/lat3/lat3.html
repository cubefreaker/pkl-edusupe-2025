<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>latihan 3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row my-5">
        <h1 class="text-center">Episode 16 - Latihan Operator</h1>
      </div>
    </div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-2">
          <div class="input-group">
            <input
              id="aritmatikaAngka1"
              type="text"
              class="form-control"
              placeholder="Angka 1 "
              aria-label="Angka 1"
            />
          </div>
        </div>

        <div class="col-2">
          <!-- dropdown -->
          <div class="input-group">
            <select id="operatorAritmatika" class="form-select">
              <option selected>Pilih Operator</option>
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">X</option>
              <option value="%">%</option>
            </select>
          </div>
        </div>

        <div class="col-2">
          <div class="input-group">
            <input
              type="number"
              id="aritmatikaAngka2"
              class="form-control"
              placeholder="Angka 2 "
              aria-label="Angka 2"
            />
          </div>
        </div>

        <div class="col-3">
          <button
            type="button"
            class="btn btn-primary float-start"
            id="buttonAritmatika"
          >
            Hitung
          </button>

          <span class="mx-4" id="hasilOperasiAritmatika">Hasil</span>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-2">
          <div class="input-group">
            <input
              id="boolean1"
              type="text"
              class="form-control"
              placeholder="boolean 1 "
              aria-label="boolean 1"
            />
          </div>
        </div>

        <div class="col-2">
          <!-- dropdown -->
          <div class="input-group">
            <select id="operatorLogika" class="form-select">
              <option selected>Pilih Operator</option>
              <option value="&&">and</option>
              <option value="||">or</option>
            </select>
          </div>
        </div>

        <div class="col-2">
          <div class="input-group">
            <input
              type="number"
              id="boolean2"
              class="form-control"
              placeholder="boolean 2 "
              aria-label="boolean 2"
            />
          </div>
        </div>

        <div class="col-3">
          <button
            type="button"
            class="btn btn-primary float-start"
            id="buttonLogika"
          >
            Hasil Logika
          </button>

          <span class="mx-4" id="hasilOperasiLogika">Hasil</span>
        </div>
      </div>
    </div>

    <script src="lat3.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
